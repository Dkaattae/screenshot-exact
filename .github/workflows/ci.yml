name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format:check
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      localstack:
        image: localstack/localstack:4.9
        env:
          SERVICES: s3
        ports:
          - 4566:4566
    env:
      # Fail, not skip, when LocalStack is unreachable.
      TRYON_TEST_REQUIRE_S3: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --diff .
      - name: Wait for LocalStack
        run: |
          for _ in $(seq 60); do
            curl -sf http://localhost:4566/_localstack/health | grep -q '"s3": "\(available\|running\)"' && exit 0
            sleep 2
          done
          exit 1
      - name: Test
        run: uv run pytest
